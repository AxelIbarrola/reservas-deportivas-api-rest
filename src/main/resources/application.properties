spring.application.name=tienda-pedagogica
server.port=8086

# Base H2 local: se crea al iniciar en demo/data/
spring.datasource.url=jdbc:h2:file:./data/tienda;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Clave JWT de ejemplo para prácticas locales; no usarla en producción.
# En producción utilizar una clave secreta fuerte y almacenada de forma segura.
jwt.secret=3ce63a27-8bcf-442f-bce2-d1d73169fd6c
jwt.expiration=3600000

# Credenciales de la cuenta administradora para la DEMO LOCAL.
# Se crea al iniciar la aplicación; la contraseña se guarda cifrada con BCrypt en H2.
# Si ya existe el ADMIN, al reiniciar se actualiza su contraseña si fue modificada aquí.
# NO publicar estas credenciales ni utilizar esta configuración en producción.
demo.admin.username=admin
demo.admin.password=Admin12345!
